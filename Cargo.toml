[package]
name = "arcband"
version = "0.2.0"
edition = "2024"
description = "GPU vector font renderer via circular arcs and lines"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = { version = "30.0", features = ["spirv"] }
bytemuck = { version = "1.25", features = ["derive"] }
ttf-parser = "0.25"

[dev-dependencies]
winit = "0.30.13"
pollster = "0.4"
sysinfo = "0.30"

[[example]]
name = "vector_bench"
path = "examples/vector_bench.rs"